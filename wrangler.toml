name = "flow-p12"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "flow-p12-db"
database_id = "ebe2e0d8-bb4e-4b36-951a-a7230dc2371e"

[[r2_buckets]]
binding = "R2"
bucket_name = "flow-p12-images"

[[kv_namespaces]]
binding = "KV"
id = "86ca5e692539459eafd39049e4dd421b"

# Autenticação: defina AUTH_SECRET, AUTH_EMAIL e AUTH_PASSWORD em
# Workers → Settings → Variables and Secrets (tipo Secret) ou:
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put AUTH_EMAIL
#   npx wrangler secret put AUTH_PASSWORD
[vars]
NODE_ENV = "production"

[dev]
port = 8788
